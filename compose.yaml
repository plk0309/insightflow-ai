name: insightflow

services:
  db:
    image: postgres:17
    container_name: insightflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: insightflow
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: